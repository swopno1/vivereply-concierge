<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Glowing gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00FF94" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Ambient Circle -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#neonCyan)" stroke-width="1.5" stroke-opacity="0.15" />
  
  <!-- Left Wing of 'V' (Glassy Cyan) -->
  <path d="M 50 50 
           L 75 50 
           L 100 135 
           L 75 135 Z" 
        fill="url(#neonCyan)" 
        filter="url(#glow)" />
        
  <!-- Right Wing of 'V' (Glassy Purple, overlapping and forming the reply sweep) -->
  <path d="M 125 50 
           L 150 50 
           L 100 135 
           L 125 135 Z" 
        fill="url(#neonPurple)" 
        fill-opacity="0.8" 
        filter="url(#glow)" />

  <!-- Neural Dot representing the AI engine (Active Reply Node) -->
  <circle cx="100" cy="135" r="9" fill="#00FF94" filter="url(#glow)" />
</svg>
