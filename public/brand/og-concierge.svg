<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00FF94"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#FF007A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- OG/social banner source (1200x630). Export to public/og-concierge.png. -->
  <rect width="1200" height="630" fill="#0C1222"/>
  <circle cx="1040" cy="90" r="220" fill="#00E5FF" opacity="0.05"/>
  <circle cx="120" cy="560" r="180" fill="#8B5CF6" opacity="0.06"/>
  <g transform="translate(120,155) scale(1.6)">
    <circle cx="100" cy="100" r="85" fill="none" stroke="url(#neonCyan)" stroke-width="1.5" stroke-opacity="0.15"/>
    <path d="M 50 50 L 75 50 L 100 135 L 75 135 Z" fill="url(#neonCyan)" filter="url(#glow)"/>
    <path d="M 125 50 L 150 50 L 100 135 L 125 135 Z" fill="url(#neonPurple)" fill-opacity="0.8" filter="url(#glow)"/>
    <circle cx="100" cy="135" r="9" fill="#00FF94" filter="url(#glow)"/>
  </g>
  <text x="500" y="300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="76" font-weight="700" fill="#FFFFFF">Vivereply Concierge</text>
  <text x="500" y="370" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" fill="#9FB3C8">AI front-of-house for resorts</text>
  <text x="500" y="430" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" fill="#00E5FF">app.vivereply.com</text>
</svg>
